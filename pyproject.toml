[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kavi-capability-compiler"
version = "0.0.1"
description = "Framework-agnostic least-authority compiler for AI agents"
requires-python = ">=3.11"
dependencies = ["mcp>=2.2,<3"]

[project.scripts]
kcc = "kavi_capability_compiler.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
