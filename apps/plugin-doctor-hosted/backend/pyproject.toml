[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kavi-plugin-doctor-backend"
version = "0.0.1"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi[standard]>=0.115,<1",
  "httpx>=0.28,<1",
  "kavi-capability-compiler[mcp] @ https://github.com/kOs-tile/kavi-capability-compiler/releases/download/v0.1.1/kavi_capability_compiler-0.1.1-py3-none-any.whl"
]
