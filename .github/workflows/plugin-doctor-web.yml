name: plugin-doctor-web

on:
  pull_request:
    branches:
      - main
      - product/plugin-doctor-v0
    paths:
      - "apps/plugin-doctor-hosted/**"
      - ".github/workflows/plugin-doctor-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install frontend dependencies
        working-directory: apps/plugin-doctor-hosted/frontend
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: apps/plugin-doctor-hosted/frontend
        run: npm run build

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: apps/plugin-doctor-hosted/backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pytest
      - name: Run backend tests
        working-directory: apps/plugin-doctor-hosted/backend
        run: pytest -q
