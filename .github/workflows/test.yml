  release-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install release verification tools
        run: python -m pip install "build==1.6.1" "twine==7.0.0" "wheel==0.48.0" "setuptools==84.0.0"
      - name: Build release artifacts twice from the same commit epoch
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          echo "$SOURCE_DATE_EPOCH" > /tmp/kcc-source-date-epoch
          rm -rf build dist
          find src -maxdepth 1 -name '*.egg-info' -type d -exec rm -rf {} +
          rm -rf /tmp/kcc-dist-a /tmp/kcc-dist-b
          python -m build --no-isolation --outdir /tmp/kcc-dist-a
          rm -rf build
          find src -maxdepth 1 -name '*.egg-info' -type d -exec rm -rf {} +
          python -m build --no-isolation --outdir /tmp/kcc-dist-b
      - name: Canonicalize sdist archive metadata to the commit epoch
        run: |
          epoch="$(cat /tmp/kcc-source-date-epoch)"
          python scripts/normalize_sdist.py /tmp/kcc-dist-a/*.tar.gz "$epoch"
          python scripts/normalize_sdist.py /tmp/kcc-dist-b/*.tar.gz "$epoch"
      - name: Require bit-for-bit reproducible release artifacts and clean wheel surface
        run: python scripts/verify_reproducible_builds.py /tmp/kcc-dist-a /tmp/kcc-dist-b
      - name: Verify release metadata
        run: python -m twine check /tmp/kcc-dist-a/*
