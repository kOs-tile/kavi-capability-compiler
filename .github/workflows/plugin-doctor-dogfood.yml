name: plugin-doctor-dogfood

on:
  pull_request:
    branches:
      - main
      - product/plugin-doctor-v0
    paths:
      - "labs/plugin_doctor/**"
      - "tests/test_plugin_doctor_*.py"
      - ".github/workflows/plugin-doctor-dogfood.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-plugin-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install dependency-free KCC core
        run: python -m pip install -e .
      - name: Audit real public Agent Plugin package
        env:
          GITHUB_TOKEN: ""
        run: |
          python -m labs.plugin_doctor.cli github \
            https://github.com/AvdLee/Swift-Concurrency-Agent-Skill \
            --html-out /tmp/plugin-doctor-scorecard.html \
            > /tmp/plugin-doctor-dogfood.json

          python - <<'PY'
          import json

          report=json.load(open("/tmp/plugin-doctor-dogfood.json"))
          package=report["package"]

          assert report["source"]["kind"]=="github", report
          assert package["state"]=="SHIP", package
          assert package["summary"]["valid_skills"] >= 1, package
          assert package["summary"]["blockers"] == 0, package

          scorecard=open("/tmp/plugin-doctor-scorecard.html").read()
          assert "SHIP" in scorecard
          assert "100" in scorecard
          assert "KAVI Plugin Doctor" in scorecard

          print(json.dumps({
              "repository": report["source"]["repository"],
              "ref": report["source"]["ref"],
              "state": package["state"],
              "score": package["score"],
              "valid_skills": package["summary"]["valid_skills"],
              "blockers": package["summary"]["blockers"],
          }, sort_keys=True))
          PY

      - name: Audit public Agent Plugin corpus
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os

          from labs.plugin_doctor.ingest import audit_github_package

          repositories = [
              "https://github.com/AvdLee/Swift-Concurrency-Agent-Skill",
              "https://github.com/agentplugins/agent-plugins-example",
              "https://github.com/cloudflare/skills",
              "https://github.com/GoogleCloudPlatform/data-agent-kit-plugin",
              "https://github.com/solana-mobile/solana-mobile-skills",
              "https://github.com/AgentsORG/design-engineering",
              "https://github.com/jonhill90/skills",
              "https://github.com/valetdotdev/skills",
              "https://github.com/dodopayments/dodo-agent-plugin",
              "https://github.com/jongio/skills",
              "https://github.com/aws-samples/sample-well-architected-skills-and-steering",
              "https://github.com/ievo-ai/skills",
          ]

          rows = []
          for repository in repositories:
              try:
                  result = audit_github_package(
                      repository,
                      token=os.environ.get("GITHUB_TOKEN"),
                      public_submission=True,
                  )
                  package = result["package"]
                  rows.append({
                      "repository": repository,
                      "ref": result["source"]["ref"],
                      "state": package["state"],
                      "score": package["score"],
                      "findings": package["summary"]["findings"],
                      "blockers": package["summary"]["blockers"],
                      "valid_skills": package["summary"]["valid_skills"],
                      "remote_mcp_servers": package["summary"]["remote_mcp_servers"],
                      "codes": sorted({f["code"] for f in package["findings"]}),
                  })
              except Exception as exc:
                  rows.append({
                      "repository": repository,
                      "error_type": type(exc).__name__,
                      "error": str(exc)[:240],
                  })

          with open("/tmp/plugin-doctor-public-corpus.json", "w", encoding="utf-8") as fh:
              json.dump(rows, fh, indent=2, sort_keys=True)

          assert len(rows) == len(repositories)
          assert all("repository" in row for row in rows)
          print(json.dumps(rows, sort_keys=True))
          PY

      - name: Prove malformed package fails closed
        run: |
          python -m labs.plugin_doctor.cli package             labs/plugin_doctor/fixtures/broken-plugin             > /tmp/plugin-doctor-broken-package.json

          python - <<'PY'
          import json
          report=json.load(open("/tmp/plugin-doctor-broken-package.json"))
          package=report["package"]
          assert package["state"]=="BLOCKED", package
          assert package["summary"]["blockers"] >= 1, package
          assert any(f["code"]=="PD-SKILL-003" for f in package["findings"]), package
          print(json.dumps({
              "state": package["state"],
              "score": package["score"],
              "blockers": package["summary"]["blockers"],
          }, sort_keys=True))
          PY

      - name: Prove ambiguous and destructive tools are surfaced
        run: |
          python -m labs.plugin_doctor.cli source             labs/plugin_doctor/fixtures/unsafe-tools.json             --format generic             --namespace dogfood             > /tmp/plugin-doctor-unsafe-tools.json

          python - <<'PY'
          import json
          report=json.load(open("/tmp/plugin-doctor-unsafe-tools.json"))
          codes={finding["code"] for finding in report["findings"]}
          assert report["state"]=="BLOCKED", report
          assert "KCC-A100" in codes, report
          assert "PD-S001" not in codes, report
          assert "PD-R001" in codes, report
          print(json.dumps({
              "state": report["state"],
              "score": report["score"],
              "codes": sorted(codes),
          }, sort_keys=True))
          PY

      - name: Prove invocation positive and negative controls
        run: |
          python -m labs.plugin_doctor.cli evals             labs/plugin_doctor/fixtures/invocation-evals.json             > /tmp/plugin-doctor-invocation-evals.json

          python - <<'PY'
          import json
          report=json.load(open("/tmp/plugin-doctor-invocation-evals.json"))
          assert report["total"]==2, report
          assert report["failed"]==0, report
          assert report["pass_rate"]==1.0, report
          print(json.dumps({
              "runner": report["runner"],
              "total": report["total"],
              "passed": report["passed"],
              "failed": report["failed"],
          }, sort_keys=True))
          PY
