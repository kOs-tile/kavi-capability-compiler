name: deploy-simple-index

on:
  workflow_dispatch:

concurrency:
  group: kcc-simple-index-current-release
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Resolve current release metadata
        run: |
          set -euo pipefail
          echo "KCC_VERSION=$(python scripts/release_version.py version)" >> "$GITHUB_ENV"
          echo "KCC_TAG=$(python scripts/release_version.py tag)" >> "$GITHUB_ENV"

      - name: Download current immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          KCC_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$KCC_REPOSITORY/releases/tags/$KCC_TAG" > /tmp/kcc-pages-release.json
          python - <<'PY'
          import json
          release=json.load(open("/tmp/kcc-pages-release.json"))
          if release.get("immutable") is not True:
              raise SystemExit("refusing Pages deploy from a non-immutable release")
          PY
          mkdir -p dist
          gh release download "$KCC_TAG"             --repo "$KCC_REPOSITORY"             --pattern "kavi_capability_compiler-${KCC_VERSION}-*.whl"             --pattern "kavi_capability_compiler-${KCC_VERSION}.tar.gz"             --pattern 'SHA256SUMS'             --dir dist
          test "$(ls dist/*.whl | wc -l)" -eq 1
          test "$(ls dist/*.tar.gz | wc -l)" -eq 1
          test -f dist/SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Rebuild Simple Repository index from verified release assets
        run: |
          set -euo pipefail
          python scripts/build_simple_index.py dist site
          python scripts/verify_simple_index.py site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

      - name: Deploy Simple Repository index
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
