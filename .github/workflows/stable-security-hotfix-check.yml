name: KCC 0.1.2 maintenance security test (NO publish)
on:
  push:
    branches:
      - hotfix/v0.1.2-literal-guard-20261103
      - stable/0.1
  pull_request:
    branches:
      - stable/0.1
permissions:
  contents: read
jobs:
  stable-patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout maintenance candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install offline test and build tooling
        run: python -m pip install "pytest==8.4.2" "build==1.6.1" "wheel==0.48.0" "setuptools==84.0.0"
      - name: Verify release metadata (NO publication)
        run: |
          python scripts/verify_release_metadata.py
          python scripts/release_version.py tag | grep -Fx 'v0.1.2'
      - name: Run strict authorization regressions against patched source
        run: |
          python -m pip install --no-deps -e .
          python -m pytest -q \
            tests/test_guard_literal_parameter_presence.py \
            tests/test_runtime_guard.py
      - name: Build patch wheel and clean-install to isolated environment
        run: |
          python -m build --wheel --no-isolation
          python -m venv /tmp/kcc-stable-patch-clean
          /tmp/kcc-stable-patch-clean/bin/python -m pip install --no-deps dist/kavi_capability_compiler-0.1.2-py3-none-any.whl
          cd /tmp
          /tmp/kcc-stable-patch-clean/bin/python - <<'PY'
          import kavi_capability_compiler as kcc
          assert kcc.__version__ == "0.1.2"
          assert "site-packages" in kcc.__file__
          manifest=kcc.adapt_capabilities("generic", {"tools":[{
              "name":"read_record",
              "description":"Read one synthetic tenant-scoped record",
              "input_schema":{
                  "type":"object",
                  "properties":{"customer_id":{"type":"string"}},
                  "required":["customer_id"]},
          }]}, namespace="stable-wheel-smoke")
          inventory=kcc.scan_manifest(manifest)
          cid=inventory["capabilities"][0]["id"]
          cap=kcc.compile_capsule(inventory, {
              "task":"Read only synthetic tenant-a-001",
              "capabilities":[cid],
              "ttl_seconds":300,
              "capability_constraints":{cid:{
                  "operations":["read"],
                  "parameters":{"customer_id":"tenant-a-001"}}}},
              {"default":"allow"}, now=100)
          guard=kcc.Guard.from_capsule(cap,inventory=inventory)
          assert guard.authorize(cid,operation="read",parameters={},now=101) == {
              "allowed":False,"reason":"required_parameter_missing:customer_id"}
          calls=[]
          try:
              guard.dispatch_sync(cid,lambda p:calls.append(p),operation="read",
                                  parameters={},now=101)
          except kcc.AuthorityDenied:
              pass
          else:
              raise AssertionError("unsafe dispatch reached host from installed wheel")
          assert not calls
          ok=guard.dispatch_sync(cid,lambda p:calls.append(dict(p)),
                                 operation="read",
                                 parameters={"customer_id":"tenant-a-001"},now=101)
          assert ok["executed"] is True
          assert calls == [{"customer_id":"tenant-a-001"}]
          print("Installed stable 0.1.2 wheel: missing literal DENIED; valid read ALLOWED")
          PY
      - name: Upload pre-release candidate wheel (NOT a published release)
        if: ${{ matrix.python-version == '3.11' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kcc-v0.1.2-candidate-wheel-${{ github.sha }}
          path: dist/kavi_capability_compiler-0.1.2-py3-none-any.whl
          retention-days: 3
          if-no-files-found: error
