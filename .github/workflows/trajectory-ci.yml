name: trajectory-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  trajectory-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Trajectory gate regression tests
        run: python -m pytest -q tests/test_trajectory_ci.py
      - name: Golden partial-order trace must pass
        run: python scripts/trajectory_ci.py --policy examples/trajectory/policy.json --trace examples/trajectory/pass.json
      - name: Approval bypass fixture must fail
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python scripts/trajectory_ci.py --policy examples/trajectory/policy.json --trace examples/trajectory/fail.json
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Expected policy violation exit 1; received $status"
            exit 1
          fi
