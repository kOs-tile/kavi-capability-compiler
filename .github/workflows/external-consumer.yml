name: external-consumer-dogfood

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published KCC version to validate"
        required: true
        default: "0.1.0"
        type: string
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/external-consumer.yml"
      - "scripts/external_consumer_dogfood.py"
      - "docs/EXTERNAL_CONSUMER_DOGFOOD.md"

permissions:
  contents: read

env:
  KCC_TARGET_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '0.1.0' }}

jobs:
  external-consumer:
    name: python-${{ matrix.python }} / ${{ matrix.distribution }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        distribution: ["pages-index", "release-wheel"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          check-latest: false

      - name: Create isolated consumer environment
        run: |
          set -euo pipefail
          python -m venv /tmp/kcc-consumer
          cd /tmp
          PYTHONPATH="" /tmp/kcc-consumer/bin/python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("kavi_capability_compiler") is None
          PY

      - name: Install from GitHub Pages Simple Repository
        if: matrix.distribution == 'pages-index'
        run: |
          set -euo pipefail
          cd /tmp
          PYTHONPATH="" /tmp/kcc-consumer/bin/python -m pip install             --disable-pip-version-check             --no-cache-dir             --index-url https://kos-tile.github.io/kavi-capability-compiler/simple/             "kavi-capability-compiler==${KCC_TARGET_VERSION}"

      - name: Install direct GitHub Release wheel
        if: matrix.distribution == 'release-wheel'
        run: |
          set -euo pipefail
          cd /tmp
          PYTHONPATH="" /tmp/kcc-consumer/bin/python -m pip install             --disable-pip-version-check             --no-cache-dir             https://github.com/kOs-tile/kavi-capability-compiler/releases/download/v${KCC_TARGET_VERSION}/kavi_capability_compiler-${KCC_TARGET_VERSION}-py3-none-any.whl

      - name: Exercise installed public SDK only
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          set -euo pipefail
          rm -rf /tmp/kcc-external-consumer
          mkdir -p /tmp/kcc-external-consumer
          cp "$GITHUB_WORKSPACE/scripts/external_consumer_dogfood.py" /tmp/kcc-external-consumer/
          cd /tmp/kcc-external-consumer
          PYTHONPATH="" /tmp/kcc-consumer/bin/python external_consumer_dogfood.py             --distribution "$DISTRIBUTION"             --expected-version "$KCC_TARGET_VERSION"             --output "$GITHUB_WORKSPACE/evidence/${PYTHON_VERSION}-${DISTRIBUTION}.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kcc-external-consumer-${{ matrix.python }}-${{ matrix.distribution }}
          path: evidence/*.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: aggregate-external-consumer-evidence
    needs: external-consumer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: kcc-external-consumer-*
          path: /tmp/evidence
          merge-multiple: true

      - name: Verify complete cohort
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path("/tmp/evidence")
          files=sorted(root.glob("*.json"))
          if len(files)!=8:
              raise SystemExit(f"expected 8 evidence files, got {len(files)}")

          rows=[json.loads(path.read_text()) for path in files]
          expected={
              (python,distribution)
              for python in ("3.11","3.12","3.13","3.14")
              for distribution in ("pages-index","release-wheel")
          }
          actual={
              (".".join(row["python"].split(".")[:2]),row["distribution"])
              for row in rows
          }
          if actual!=expected:
              raise SystemExit(f"cohort mismatch: {sorted(actual)}")
          if not all(row.get("pass") is True for row in rows):
              raise SystemExit("one or more external-consumer cells failed")

          combined={
              "schema":"kcc.external-consumer-cohort.v1",
              "pass":True,
              "cells":rows,
          }
          Path("/tmp/kcc-external-consumer-cohort.json").write_text(
              json.dumps(combined,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps({
              "validation":"KCC_EXTERNAL_CONSUMER_COHORT",
              "cells":len(rows),
              "pass":True,
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kcc-external-consumer-cohort
          path: /tmp/kcc-external-consumer-cohort.json
          if-no-files-found: error
          retention-days: 30
